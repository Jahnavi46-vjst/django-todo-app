
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - My To-Do List</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        .login-button {
            width: 100%;
            background-color: #333;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .login-button:hover {
            background-color: #555;
        }

        .error {
            background-color: #f8d7da;
            color: #842029;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>🔐 Login</h1>

        <p class="subtitle">
            Login to access your To-Do List
        </p>

        {% if form.errors %}
            <div class="error">
                Invalid username or password.
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="id_username">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="id_username"
                placeholder="Enter your username"
                required
            >

            <label for="id_password">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="id_password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>

    </div>

</body>
</html>
